<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Sports Scores</title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2em;
      color: #eee;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    td {
      padding: 8px;
      border-bottom: 1px solid #333;
      vertical-align: middle;
    }
    .time-col {
      width: 80px;
      font-weight: bold;
    }
    .match-col {
      flex: 1;
    }
    .links-col {
      text-align: right;
      width: 120px;
    }
    /* Placeholder styling for the betting logos */
    .links-col img {
      height: 1.2em;
      margin-left: 8px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <h1>Live Sports Scores</h1>
  <table id="scores-table">
    <tbody></tbody>
  </table>

  <!-- Firebase compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    // Your FlashLive Sports Scraper project's config
    const firebaseConfig = {
      apiKey: "AIzaSyAtVcKiDt0J-60_Psit5Ip2HCL7FN2NVgI",
      authDomain: "flashlive-sports-scraper.firebaseapp.com",
      projectId: "flashlive-sports-scraper",
      storageBucket: "flashlive-sports-scraper.firebasestorage.app",
      messagingSenderId: "227831135271",
      appId: "1:227831135271:web:29e655cac33b2e32d42202",
      measurementId: "G-RMBDDB0MF2"
    };
    // Initialize Firebase & Firestore
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Helper to format UNIX timestamps to "5:00 AM"
    function formatTime(unix) {
      return new Date(unix * 1000)
        .toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }

    const tbody = document.querySelector("#scores-table tbody");

    // Real-time listener
    db.collection('artifacts')
      .doc('flashlivesportsscraperdata')
      .collection('public')
      .doc('data')
      .collection('sportsGames')
      .orderBy('Start Time Unix')
      .onSnapshot(snapshot => {
        // Clear existing rows
        tbody.innerHTML = '';
        let lastTime = null;

        snapshot.docs.forEach(doc => {
          const game = doc.data();
          const timeStr = formatTime(game['Start Time Unix']);

          const tr = document.createElement('tr');

          // Time column (only show when different from previous)
          const tdTime = document.createElement('td');
          tdTime.className = 'time-col';
          tdTime.textContent = timeStr !== lastTime ? timeStr : '';
          tr.appendChild(tdTime);

          // Teams column
          const tdMatch = document.createElement('td');
          tdMatch.className = 'match-col';
          tdMatch.textContent = `${game['Home Team']} vs ${game['Away Team']}`;
          tr.appendChild(tdMatch);

          // Betting logos column (replace src with your actual images)
          const tdLinks = document.createElement('td');
          tdLinks.className = 'links-col';
          tdLinks.innerHTML = `
            <img src="bet365.png" alt="bet365">
            <img src="unibet.png" alt="Unibet">
          `;
          tr.appendChild(tdLinks);

          tbody.appendChild(tr);
          lastTime = timeStr;
        });
      }, error => {
        console.error("Error loading scores:", error);
        tbody.innerHTML = `<tr><td colspan="3">Error loading scores.</td></tr>`;
      });
  </script>
</body>
</html>
