<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Sports Scores by League</title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2em;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    td {
      padding: 8px;
      border-bottom: 1px solid #333;
      vertical-align: middle;
    }
    /* League header styling */
    .league-header td {
      background: #222;
      color: #ffcc00;
      font-size: 1.2em;
      font-weight: bold;
      border: none;
      padding: 12px 8px;
    }
    /* Column widths & alignment */
    .time-col {
      width: 80px;
      font-weight: bold;
    }
    .match-col {
      /* expands */
    }
    .score-col {
      width: 80px;
      text-align: center;
    }
    .status-col {
      width: 120px;
      text-align: center;
      font-style: italic;
    }
    .links-col {
      text-align: right;
      width: 120px;
    }
    .links-col img {
      height: 1.2em;
      margin-left: 8px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <h1>Live Sports Scores</h1>
  <table id="scores-table">
    <tbody>
      <tr><td colspan="5">Loading…</td></tr>
    </tbody>
  </table>

  <!-- Firebase compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    // ← your flashlive-sports-scraper project's config
    const firebaseConfig = {
      apiKey: "AIzaSyAtVcKiDt0J-60_Psit5Ip2HCL7FN2NVgI",
      authDomain: "flashlive-sports-scraper.firebaseapp.com",
      projectId: "flashlive-sports-scraper",
      storageBucket: "flashlive-sports-scraper.firebasestorage.app",
      messagingSenderId: "227831135271",
      appId: "1:227831135271:web:29e655cac33b2e32d42202",
      measurementId: "G-RMBDDB0MF2"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

   // helper: UNIX → "5:00 AM"
// helper: UNIX → "5:00 AM"
function formatTime(unix) {
  return new Date(unix * 1000)
    .toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

// Mapping of original league names to display names (exact matches)
const leagueNameMap = {
  "USA: WNBA": "WNBA",
  "USA: NBA Salt Lake City Summer League": "NBA Summer League",
  "USA: MLB": "MLB",
  "World: Club Friendly": "Club Friendly",
  // Add more as needed
};

// Mapping for "contains" keywords
const leagueNameContainsMap = [
  { keyword: "Tour de France", display: "Tour de France" },
  { keyword: "Wimbledon", display: "Wimbledon" },
  // Add more as needed
];

// Function to get display name for a league
function getDisplayLeagueName(originalName) {
  // 1. Exact match mapping
  if (leagueNameMap[originalName]) {
    return leagueNameMap[originalName];
  }
  // 2. Contains mapping
  if (originalName) {
    for (const rule of leagueNameContainsMap) {
      if (originalName.toLowerCase().includes(rule.keyword.toLowerCase())) {
        return rule.display;
      }
    }
  }
  // 3. Generic: remove prefix before colon
  return originalName && originalName.includes(':') ? originalName.split(':')[1].trim() : originalName;
}

    const tbody = document.querySelector('#scores-table tbody');

    db.collection('artifacts')
      .doc('flashlivesportsscraperdata')
      .collection('public')
      .doc('data')
      .collection('sportsGames')
      .orderBy('Start Time Unix')
      .onSnapshot(snapshot => {
        // 1️⃣ Pull all games into an array
        const games = snapshot.docs.map(d => d.data());

        // 2️⃣ Group by League
        const byLeague = {};
        games.forEach(g => {
          const L = g['League'] || 'Unknown League';
          byLeague[L] = byLeague[L] || [];
          byLeague[L].push(g);
        });

        // 3️⃣ Clear table
        tbody.innerHTML = '';

        // 4️⃣ Render each league block (alphabetical)
        Object.keys(byLeague).sort().forEach(league => {
          // League header
          const headerRow = document.createElement('tr');
          headerRow.className = 'league-header';
          headerRow.innerHTML = `<td colspan="5">${getDisplayLeagueName(league)}</td>`;
          tbody.appendChild(headerRow);

          // Sort this league’s games by time
          byLeague[league]
            .sort((a, b) => a['Start Time Unix'] - b['Start Time Unix'])
            .forEach(game => {
              const tr = document.createElement('tr');

              // Time
              const tdTime = document.createElement('td');
              tdTime.className = 'time-col';
              tdTime.textContent = formatTime(game['Start Time Unix'] || 0);
              tr.appendChild(tdTime);

              // Matchup
              const tdMatch = document.createElement('td');
              tdMatch.className = 'match-col';
              tdMatch.textContent = `${game['Home Team']} vs ${game['Away Team']}`;
              tr.appendChild(tdMatch);

              // Score
              const tdScore = document.createElement('td');
              tdScore.className = 'score-col';
              // show blank if undefined
              const hs = game['Home Score'];
              const as = game['Away Score'];
              tdScore.textContent =
                (hs != null ? hs : '') + (hs!=null||as!=null ? '–' : '') + (as != null ? as : '');
              tr.appendChild(tdScore);

              // Status / timing (e.g. "Q2", "Final", "Top 3rd")
              const tdStatus = document.createElement('td');
              tdStatus.className = 'status-col';
              tdStatus.textContent = game['Status'] || '';
              tr.appendChild(tdStatus);

              // Betting logos / links
              const tdLinks = document.createElement('td');
              tdLinks.className = 'links-col';
              tdLinks.innerHTML = `
                <img src="bet365.png" alt="bet365">
                <img src="unibet.png" alt="Unibet">
              `;
              tr.appendChild(tdLinks);

              tbody.appendChild(tr);
            });
        });
      }, err => {
        console.error("Firestore error:", err);
        tbody.innerHTML = `<tr><td colspan="5" style="color:red">
          Error loading scores:<br>${err.message}
        </td></tr>`;
      });
  </script>
</body>
</html>
